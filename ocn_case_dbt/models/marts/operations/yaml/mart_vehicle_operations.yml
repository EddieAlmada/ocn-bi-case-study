version: 2

models:
  - name: mart_vehicle_operations
    description: '{{ doc("mart_vehicle_operations") }}'
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "gps_to_driver_assignment_days is null or gps_to_driver_assignment_days >= 0"
          config:
            severity: warn
      - dbt_utils.expression_is_true:
          arguments:
            expression: "completed_workshop_days >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "inferred_workshop_visit_count <= completed_workshop_visit_count"
    columns:
      - name: vin
        description: '{{ doc("db_stock_vehicles__vin") }}'
        data_tests: [not_null, unique]
      - name: park_name
        description: '{{ doc("mart_vehicle_operations__park_name") }}'
        data_tests: [not_null]
      - name: is_inventory_vehicle
        description: '{{ doc("mart_vehicle_operations__is_inventory_vehicle") }}'
      - name: standardized_category
        description: '{{ doc("stg_db_stock_vehicles__standardized_category") }}'
      - name: standardized_sub_category
        description: '{{ doc("stg_db_stock_vehicles__standardized_sub_category") }}'
      - name: transition_count
        description: '{{ doc("mart_vehicle_operations__transition_count") }}'
      - name: workshop_visit_count
        description: '{{ doc("mart_vehicle_operations__workshop_visit_count") }}'
      - name: completed_workshop_visit_count
        description: '{{ doc("mart_vehicle_operations__completed_workshop_visit_count") }}'
      - name: completed_workshop_days
        description: '{{ doc("mart_vehicle_operations__completed_workshop_days") }}'
      - name: inferred_workshop_visit_count
        description: '{{ doc("mart_vehicle_operations__inferred_workshop_visit_count") }}'
      - name: workshop_turnaround_days
        description: '{{ doc("mart_vehicle_operations__workshop_turnaround_days") }}'
      - name: current_workshop_age_days
        description: '{{ doc("mart_vehicle_operations__current_workshop_age_days") }}'
      - name: last_transition_at
        description: '{{ doc("mart_vehicle_operations__last_transition_at") }}'
      - name: last_status_transition
        description: '{{ doc("mart_vehicle_operations__last_status_transition") }}'
      - name: operational_alert_reason
        description: '{{ doc("mart_vehicle_operations__operational_alert_reason") }}'
      - name: resolved_driver_assignment_at
        description: '{{ doc("int_vehicle_lifecycle__resolved_driver_assignment_at") }}'
      - name: first_gps_installed_at
        description: '{{ doc("int_vehicle_lifecycle__first_gps_installed_at") }}'
      - name: gps_to_driver_assignment_days
        description: '{{ doc("mart_vehicle_operations__gps_to_driver_assignment_days") }}'
      - name: driver_assignment_timestamp_source
        description: '{{ doc("int_vehicle_lifecycle__driver_assignment_timestamp_source") }}'
      - name: has_delivery_assignment_timestamp_conflict
        description: '{{ doc("int_vehicle_lifecycle__has_delivery_assignment_timestamp_conflict") }}'
      - name: delivery_assignment_day_difference
        description: '{{ doc("int_vehicle_lifecycle__delivery_assignment_day_difference") }}'
