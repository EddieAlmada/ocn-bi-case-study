version: 2

models:
  - name: fct_vehicle_events
    description: '{{ doc("fct_vehicle_events") }}'
    columns:
      - name: vehicle_event_id
        description: '{{ doc("int_vehicle_events__vehicle_event_id") }}'
        data_tests: [not_null, unique]
      - name: history_id
        description: '{{ doc("db_stock_update_history__history_id") }}'
        data_tests: [not_null]
      - name: vin
        description: '{{ doc("db_stock_update_history__vin") }}'
        data_tests: [not_null]
      - name: event_date
        description: '{{ doc("fct_vehicle_events__event_date") }}'
      - name: event_month
        description: '{{ doc("fct_vehicle_events__event_month") }}'
      - name: event_sequence
        description: '{{ doc("fct_vehicle_events__event_sequence") }}'
      - name: previous_event_type
        description: '{{ doc("fct_vehicle_events__previous_event_type") }}'
      - name: previous_event_at
        description: '{{ doc("fct_vehicle_events__previous_event_at") }}'
      - name: days_since_previous_event
        description: '{{ doc("fct_vehicle_events__days_since_previous_event") }}'
