version: 2

models:
  - name: fct_vehicle_daily_snapshot
    description: '{{ doc("fct_vehicle_daily_snapshot") }}'
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [snapshot_date, vin]
    columns:
      - name: snapshot_date
        description: '{{ doc("fct_vehicle_daily_snapshot__snapshot_date") }}'
        data_tests: [not_null]
      - name: vin
        description: '{{ doc("db_stock_vehicles__vin") }}'
        data_tests: [not_null]
      - name: state_name
        description: '{{ doc("stg_db_stock_vehicles__state_name") }}'
      - name: standardized_category
        description: '{{ doc("stg_db_stock_vehicles__standardized_category") }}'
      - name: standardized_sub_category
        description: '{{ doc("stg_db_stock_vehicles__standardized_sub_category") }}'
      - name: normalized_status
        description: '{{ doc("fct_vehicle_daily_snapshot__normalized_status") }}'
      - name: days_in_inventory
        description: '{{ doc("fct_vehicle_daily_snapshot__days_in_inventory") }}'
      - name: days_in_current_status
        description: '{{ doc("fct_vehicle_daily_snapshot__days_in_current_status") }}'
      - name: is_idle
        description: '{{ doc("fct_vehicle_daily_snapshot__is_idle") }}'
      - name: is_workshop
        description: '{{ doc("fct_vehicle_daily_snapshot__is_workshop") }}'
      - name: is_withdrawn
        description: '{{ doc("fct_vehicle_daily_snapshot__is_withdrawn") }}'
      - name: is_assigned
        description: '{{ doc("fct_vehicle_daily_snapshot__is_assigned") }}'
      - name: is_over_45_days_in_stock
        description: '{{ doc("fct_vehicle_daily_snapshot__is_over_45_days_in_stock") }}'
      - name: is_unproductive
        description: '{{ doc("fct_vehicle_daily_snapshot__is_unproductive") }}'
