version: 2

models:
  - name: int_vehicle_status_transitions
    description: '{{ doc("int_vehicle_status_transitions") }}'
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "days_in_status is null or days_in_status >= 0"
    columns:
      - name: vehicle_status_transition_id
        description: '{{ doc("int_vehicle_status_transitions__vehicle_status_transition_id") }}'
        data_tests:
          - not_null
          - unique
      - name: stock_vehicle_status_histories_id
        description: '{{ doc("db_stock_vehicles_status_histories__stock_vehicle_status_histories_id") }}'
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: vin
        description: '{{ doc("db_stock_vehicles_status_histories__vin") }}'
        data_tests:
          - not_null
      - name: days_in_status
        description: '{{ doc("int_vehicle_status_transitions__days_in_status") }}'
      - name: normalized_status
        description: '{{ doc("int_vehicle_status_transitions__normalized_status") }}'
      - name: normalized_previous_status
        description: '{{ doc("int_vehicle_status_transitions__normalized_previous_status") }}'
      - name: has_invalid_date_range
        description: '{{ doc("int_vehicle_status_transitions__has_invalid_date_range") }}'
        data_tests:
          - accepted_values:
              arguments:
                values: [false]
              config:
                severity: warn
      - name: is_status_change
        description: '{{ doc("int_vehicle_status_transitions__is_status_change") }}'
      - name: is_category_change
        description: '{{ doc("int_vehicle_status_transitions__is_category_change") }}'
