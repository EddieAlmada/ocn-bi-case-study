version: 2

models:
  - name: stg_db_stock_update_history__ocn_sources
    description: >
      Historical log of vehicle updates and operational events.

    columns:
      - name: history_id
        description: Unique identifier for each vehicle update event.
        data_tests:
          - not_null
          - unique

      - name: vin
        description: Vehicle identification number associated with the event.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stock_vehicles')
                field: vin

      - name: contract
        description: Contract associated with the vehicle event.
        data_tests:
          - not_null

      - name: step
        description: Operational event or step recorded for the vehicle.
        data_tests:
          - not_null

      - name: time
        description: Timestamp when the event occurred.
        data_tests:
          - not_null

      - name: user_id
        description: User responsible for generating or recording the event.
        data_tests:
          - not_null