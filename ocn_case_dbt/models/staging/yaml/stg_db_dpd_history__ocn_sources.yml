version: 2

models:
  - name: stg_db_dpd_history__ocn_sources
    description: '{{ doc("db_dpd_history") }}'

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - business_date
              - contract_number

      - dbt_utils.expression_is_true:
          arguments:
            expression: "dpd >= 0"

    columns:
      - name: business_date
        description: '{{ doc("db_dpd_history__business_date") }}'
        data_tests:
          - not_null

      - name: contract_number
        description: '{{ doc("db_dpd_history__contract_number") }}'
        data_tests:
          - not_null

      - name: vin
        description: '{{ doc("db_dpd_history__vin") }}'
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_db_stock_vehicles__ocn_sources')
                field: vin

      - name: dpd
        description: '{{ doc("db_dpd_history__dpd") }}'
        data_tests:
          - not_null

      - name: last_payment_received_date
        description: '{{ doc("db_dpd_history__last_payment_received_date") }}'
        data_tests:
          - not_null
