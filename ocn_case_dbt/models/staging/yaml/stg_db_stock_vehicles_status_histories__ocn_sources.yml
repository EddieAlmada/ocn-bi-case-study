version: 2

models:
  - name: stg_db_stock_vehicles_status_histories__ocn_sources
    description: '{{ doc("db_stock_vehicles_status_histories") }}'

    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "date_out IS NULL OR date_out >= date_in"
          config:
            severity: warn

    columns:
      - name: stock_vehicle_status_histories_id
        description: '{{ doc("db_stock_vehicles_status_histories__stock_vehicle_status_histories_id") }}'
        data_tests:
          - not_null:
              config:
                severity: warn
          - unique:
              config:
                severity: warn

      - name: vin
        description: '{{ doc("db_stock_vehicles_status_histories__vin") }}'
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_db_stock_vehicles__ocn_sources')
                field: vin

      - name: contract_number
        description: '{{ doc("db_stock_vehicles_status_histories__contract_number") }}'
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: created_at
        description: '{{ doc("db_stock_vehicles_status_histories__created_at") }}'
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: date_in
        description: '{{ doc("db_stock_vehicles_status_histories__date_in") }}'
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: status
        description: '{{ doc("db_stock_vehicles_status_histories__status") }}'
        data_tests:
          - not_null:
              config:
                severity: warn
          - accepted_values:
              arguments:
                values:
                  - active
                  - inactive
              config:
                severity: warn

      - name: previous_status
        description: '{{ doc("db_stock_vehicles_status_histories__previous_status") }}'
        data_tests:
          - not_null:
              config:
                severity: warn
          - accepted_values:
              arguments:
                values:
                  - active
                  - inactive
              config:
                severity: warn

      - name: is_canceled
        description: '{{ doc("db_stock_vehicles_status_histories__is_canceled") }}'
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: is_completed
        description: '{{ doc("db_stock_vehicles_status_histories__is_completed") }}'
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: standardized_category
        description: '{{ doc("stg_db_stock_vehicles_status_histories__standardized_category") }}'

      - name: standardized_sub_category
        description: '{{ doc("stg_db_stock_vehicles_status_histories__standardized_sub_category") }}'

      - name: standardized_previous_category
        description: '{{ doc("stg_db_stock_vehicles_status_histories__standardized_previous_category") }}'

      - name: standardized_previous_sub_category
        description: '{{ doc("stg_db_stock_vehicles_status_histories__standardized_previous_sub_category") }}'
