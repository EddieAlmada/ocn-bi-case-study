version: 2

models:
  - name: stg_db_stock_vehicles__ocn_sources
    description: '{{ doc("db_stock_vehicles") }}'

    columns:
      - name: stock_vehicles_id
        description: '{{ doc("db_stock_vehicles__stock_vehicles_id") }}'
        data_tests:
          - not_null
          - unique

      - name: vin
        description: '{{ doc("db_stock_vehicles__vin") }}'
        data_tests:
          - not_null
          - unique

      - name: contract_number
        description: '{{ doc("db_stock_vehicles__contract_number") }}'
        data_tests:
          - not_null
          - unique

      - name: created_at
        description: '{{ doc("db_stock_vehicles__created_at") }}'
        data_tests:
          - not_null

      - name: updated_at
        description: '{{ doc("db_stock_vehicles__updated_at") }}'
        data_tests:
          - not_null

      - name: status
        description: '{{ doc("db_stock_vehicles__status") }}'
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: physical_status
        description: '{{ doc("db_stock_vehicles__physical_status") }}'
        data_tests:
          - not_null

      - name: vehicle_state
        description: '{{ doc("db_stock_vehicles__vehicle_state") }}'
        data_tests:
          - not_null

      - name: state_name
        description: '{{ doc("stg_db_stock_vehicles__state_name") }}'
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Aguascalientes
                  - Distrito Federal
                  - Chihuahua
                  - Jalisco
                  - Sonora
                  - Guanajuato
                  - Yucatán
                  - Nuevo León
                  - Baja California
                  - Puebla
                  - Querétaro
                  - Coahuila de Zaragoza
                  - San Luis Potosí
              config:
                severity: warn

      - name: standardized_category
        description: '{{ doc("stg_db_stock_vehicles__standardized_category") }}'

      - name: standardized_sub_category
        description: '{{ doc("stg_db_stock_vehicles__standardized_sub_category") }}'

      - name: brand
        description: '{{ doc("db_stock_vehicles__brand") }}'
        data_tests:
          - not_null

      - name: model
        description: '{{ doc("db_stock_vehicles__model") }}'
        data_tests:
          - not_null

      - name: bill_amount
        description: '{{ doc("db_stock_vehicles__bill_amount") }}'
        data_tests:
          - not_null

      - name: km
        description: '{{ doc("db_stock_vehicles__km") }}'
        data_tests:
          - not_null
